<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem("tema")}catch(e){}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)})()</script>
<title>Acesso da loja</title>
<meta name="robots" content="noindex">
</head>
<body>
<main class="center">
  <div class="panel">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg></span><div><span id="appName">Estoque da Loja</span><small id="storeName">Sua loja</small></div></div>
    <h1 id="title">Acesso pausado</h1>
    <p class="muted" id="msg">Carregando…</p>
    <p class="note" id="safe">Seus produtos, vendas e clientes continuam guardados. Assim que o acesso for renovado, tudo volta como estava.</p>
    <a class="btn main block" id="renew" href="#" target="_blank" rel="noopener" hidden>Renovar pelo WhatsApp</a>
    <div class="row between" style="margin-top:16px">
      <button type="button" class="linkbtn" id="retry">Já renovei, tentar de novo</button>
      <button type="button" class="linkbtn" id="out">Sair</button>
    </div>
  </div>
</main>
<script type="module" src="/src/assinatura/main.ts"></script>
</body>
</html>
