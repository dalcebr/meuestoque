# Cloudflare Pages — https://developers.cloudflare.com/pages/functions/wrangler-configuration/
name = "estoque-da-loja"
pages_build_output_dir = "dist"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Fotos dos produtos e do catálogo (Cloudflare R2).
# Crie o bucket com: npx wrangler r2 bucket create estoque-fotos
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "estoque-fotos"

# Variáveis NÃO secretas podem ficar aqui. Os segredos (SUPABASE_SERVICE_ROLE_KEY,
# WEBHOOK_SECRET) devem ser cadastrados no painel da Cloudflare ou em .dev.vars (local).
[vars]
# SUPABASE_URL = "https://SEU-PROJETO.supabase.co"
# Opcional: domínio público do bucket R2 (ex.: https://fotos.seudominio.com.br).
# Sem ele, as fotos são servidas pelo próprio site em /media/...
# MEDIA_PUBLIC_URL = "https://fotos.seudominio.com.br"
